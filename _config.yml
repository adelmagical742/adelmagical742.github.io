# Site settings
title: Melting_Pot
SEOTitle: Melting_Pot | 个人技术博客
header-img: img/home-bg-geek.jpg
email: ""
description: "记录代码、系统与长期主义。这里是 Melting_Pot 的个人技术实验室。"
keyword: "个人技术博客, 编程, Web, JavaScript, 前端, 工程实践, 学习笔记"
url: "https://meltingppot.github.io" # GitHub Pages 账号地址
baseurl: "/Melting_Pot.github.io" # 当前仓库是项目站点

# Publish posts or collection documents with a future date.
future: true

# SNS settings
RSS: true
# 发布前替换为你自己的账号；留空即可隐藏对应图标
weibo_username:
zhihu_username:
github_username: Melting_Pot
twitter_username:
#facebook_username:
#linkedin_username:  firstname-lastname-idxxxx

# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
highlighter: rouge
permalink: pretty
paginate: 10
exclude:
  [
    "less",
    "node_modules",
    "Gruntfile.js",
    "package.json",
    "README.md",
    "README.zh.md",
  ]
anchorjs: true # if you want to customize anchor. check out line:181 of `post.html`
# If you have timezone issue (e.g. #68) in China, uncomment to use this:
#timezone: CN

# Gems
# from PR#40, to support local preview for Jekyll 3.0
# make sure you have this gem installed
# `$ gem install jekyll-paginate`
plugins: [jekyll-paginate]

# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
kramdown:
  input: GFM # use Github Flavored Markdown !important
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Disqus settings
disqus_username:

# Netease settings
netease_comment: false

# Analytics settings
# Baidu Analytics
# ba_track_id: [your track id]

# Google Analytics
ga_track_id: "" # 填入你自己的统计 ID；默认关闭
ga_domain:

# Sidebar settings
sidebar: true # whether or not using Sidebar.
sidebar-about-description: "我是 Melting_Pot。<br>把复杂的问题拆开，把值得记录的东西留下。"
sidebar-avatar: img/avatar-lab.svg

# Featured Tags
featured-tags: true # whether or not using Feature-Tags
featured-condition-size: 0 # 新博客从第一篇文章开始展示标签

# Progressive Web Apps
chrome-tab-theme-color: "#000000"
service-worker: false

# MathJax rendering for layout:page (e.g. post preview)
page-mathjax: false

# Friends
friends: []
